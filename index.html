<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0f14;
      --surface: #16181f;
      --surface2: #1d1f29;
      --border: rgba(255,255,255,0.06);
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --me-bg: linear-gradient(135deg, #7c6af7, #a78bfa);
      --other-bg: #1d1f29;
      --text: #e8e9f0;
      --muted: #6b6d80;
      --name-color: #a78bfa;
      --radius: 18px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      min-height: 100dvh;
    }

    body {
      background: var(--bg);
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    body::before { width:400px; height:400px; background:rgba(124,106,247,.12); top:-100px; left:-100px; }
    body::after  { width:300px; height:300px; background:rgba(167,139,250,.08); bottom:-80px; right:-80px; }
.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;           /* Giới hạn chiều rộng như chat mobile */
  height: 100dvh;
  max-height: 920px;          /* Giới hạn chiều cao tối đa trên desktop */
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 24px;        /* Bo góc đẹp hơn trên desktop */
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
  background: var(--bg);
}

/* Khi màn hình rộng (desktop), căn giữa và giữ tỷ lệ đẹp */
@media (min-width: 600px) {
  .wrapper {
    height: 92vh;             /* Không chiếm full chiều cao màn hình desktop */
    max-height: 820px;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
}

    .header {
      padding: 14px 18px;
      padding-left: calc(18px + var(--safe-left));
      padding-right: calc(18px + var(--safe-right));
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,15,20,.9);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }

    .header-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--me-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent);
    }

    .header-info { flex: 1; min-width: 0; }
    .header-title { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
    .header-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

    .live-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #4ade80; margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }

    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      padding-left: calc(14px + var(--safe-left));
      padding-right: calc(14px + var(--safe-right));
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      max-width: 82%;
      animation: msgIn .25s ease forwards;
    }
    .msg.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg.other { align-self: flex-start; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }

    .bubble {
      padding: 9px 13px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.5;
      word-break: break-word;
      display: grid !important;
    }

    .msg.me .bubble {
      background: var(--me-bg);
      color: #fff;
      border-bottom-right-radius: var(--radius-sm);
    }

    .msg.other .bubble {
      background: var(--other-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: var(--radius-sm);
    }

    /* ==================== MODAL & AVATAR SELECTION ==================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: var(--surface);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
      text-align: center;
    }

    .modal-logo {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent2);
    }

    .modal-sub {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 14px;
    }

    .avatar-preview {
      font-size: 60px;
      margin: 20px 0;
      padding: 20px;
      background: var(--surface2);
      border-radius: 20px;
      display: inline-block;
      border: 3px solid var(--accent);
    }

    .section-label {
      text-align: left;
      font-size: 13px;
      color: var(--muted);
      margin: 16px 0 8px;
      font-weight: 500;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .av-opt {
      width: 54px;
      height: 54px;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      border: 2px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .av-opt:hover {
      transform: scale(1.08);
    }

    .av-opt.active {
      border-color: var(--accent);
      background: rgba(124, 106, 247, 0.15);
      transform: scale(1.1);
    }

    .modal-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 16px;
      margin-bottom: 20px;
    }

    .modal-btn {
      width: 100%;
      padding: 14px;
      background: var(--me-bg);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ==================== Các style cũ giữ nguyên ==================== */
    .translate-btn {
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .input-area {
      padding: 10px 12px;
      padding-left: calc(12px + var(--safe-left));
      padding-right: calc(12px + var(--safe-right));
      padding-bottom: calc(10px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: rgba(14,15,20,.95);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      position: relative;
    }

    #message {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      padding: 10px 13px;
      outline: none;
      resize: none;
      max-height: 30dvh;
      line-height: 1.5;
    }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 13px;
      background: var(--me-bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Emoji Picker */
    .emoji-picker {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 12px;
      right: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
      z-index: 100;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .emoji-picker.open { display: flex; }

    .ep-tabs { display: flex; background: var(--surface2); border-bottom: 1px solid var(--border); overflow-x: auto; }
    .ep-tab {
      padding: 10px 14px;
      font-size: 20px;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s;
    }
    .ep-tab.active {
      opacity: 1;
      border-bottom: 3px solid var(--accent);
    }

    .ep-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 12px;
      max-height: 220px;
      overflow-y: auto;
    }

    .ep-item {
      aspect-ratio: 1;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.1s;
    }
    .ep-item:active {
      transform: scale(0.85);
      background: rgba(124,106,247,0.2);
    }

    .emoji-btn {
      width: 44px; height: 44px;
      font-size: 24px;
      background: transparent;
      border: none;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .emoji-btn.active {
      background: rgba(124,106,247,0.25);
    }
  </style>
</head>
<body>

<!-- Modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <div class="modal-logo">Kết nối</div>
    <div class="modal-sub">Chọn avatar và nhập tên của bạn</div>

    <div class="avatar-preview" id="avatarPreview">🐱</div>

    <div class="section-label">Chọn avatar</div>
    <div class="avatar-grid" id="avatarGrid"></div>

    <div class="section-label">Tên của bạn</div>
    <input type="text" class="modal-input" id="nameInput" placeholder="Nhập tên..." maxlength="30"/>

    <button class="modal-btn" onclick="enterChat()">Vào chat →</button>
  </div>
</div>

<!-- Chat Interface -->
<div class="wrapper">
  <div class="header">
    <div class="header-avatar" id="headerAvatar">🐱</div>
    <div class="header-info">
      <div class="header-title" id="userLabel">Đang kết nối...</div>
      <div class="header-sub"><span class="live-dot"></span>Trực tuyến</div>
    </div>
  </div>

  <div id="chatBox">
    <div class="date-divider"><span>Hôm nay</span></div>
  </div>

  <div class="input-area">
    <div class="emoji-picker" id="emojiPicker">
      <div class="ep-tabs" id="epTabs"></div>
      <div class="ep-grid" id="epGrid"></div>
    </div>

    <button class="emoji-btn" id="emojiBtn">😊</button>
    <textarea id="message" placeholder="Nhắn gì đó..." rows="1"
      oninput="autoResize(this)"
      onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); send();}"></textarea>
    <button class="send-btn" onclick="send()">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#fff" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyr47rmir_MMIyAa9pzgdSvee1rzO_ly0sFwxK2a247JJImyJSUwuU8o2uihnvAs_aC/exec";

  // ==================== EMOJI PICKER ====================
  const EMOJI_CATEGORIES = [
    { icon:"😀", name:"Mặt", emojis: ["😀","😁","😂","🤣","😃","😄","😅","😆","😇","😉","😊","😋","😌","😍","🥰","😎","😏","😐","😑","😒","😓","😔","😕","😗","😘","😙","😚","😛","😜","😝","😞","😟","😠","😡","😢","😣","😤","😥","😦","😧","😨","😩","😪","😫","😬","😭","😮","😯","😰","😱","😲","😳","😴","😵","😶","😷","🙁","🙂","🙃","🙄","🤐","🤑","🤒","🤓","🤔","🤕","🤗","🤠","🤡","🤢","🤤","🤥","🤧","🤩","🤪","🤫","🤬","🤭","🤮","🤯","🥱","🥲","🥳","🥴","🥵","🥶","🥸","🥹"] },
    { icon:"👋", name:"Cử chỉ", emojis: ["👋","🤚","🖐","✋","🖖","👌","🤌","🤏","✌","🤞","🤟","🤘","🤙","👈","👉","👆","👇","☝","👍","👎","✊","👊","🤛","🤜","👏","🙌","🫶","👐","🤲","🙏"] },
    { icon:"❤️", name:"Tim", emojis: ["❤️","🧡","💛","💚","💙","💜","🖤","🤍","💔","💕","💞","💓","💗","💖","💘","💝","❤️‍🔥"] },
    { icon:"🐶", name:"Động vật", emojis: ["🐶","🐱","🐭","🐹","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐮","🐷","🐸","🐵","🙈","🙉","🙊","🐔","🐧","🐦","🦋","🐺","🦄","🐙"] }
  ];

  let pickerOpen = false;

  function buildEmojiPicker() {
    const tabsContainer = document.getElementById("epTabs");
    tabsContainer.innerHTML = "";

    EMOJI_CATEGORIES.forEach((category, index) => {
      const tab = document.createElement("div");
      tab.className = `ep-tab ${index === 0 ? "active" : ""}`;
      tab.textContent = category.icon;
      tab.onclick = () => {
        document.querySelectorAll(".ep-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        renderEmojiGrid(index);
      };
      tabsContainer.appendChild(tab);
    });

    renderEmojiGrid(0);
  }

  function renderEmojiGrid(categoryIndex) {
    const grid = document.getElementById("epGrid");
    grid.innerHTML = "";

    EMOJI_CATEGORIES[categoryIndex].emojis.forEach(emoji => {
      const item = document.createElement("div");
      item.className = "ep-item";
      item.textContent = emoji;
      item.onclick = () => insertEmoji(emoji);
      grid.appendChild(item);
    });
  }

  function insertEmoji(emoji) {
    const textarea = document.getElementById("message");
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    textarea.value = textarea.value.substring(0, start) + emoji + textarea.value.substring(end);
    textarea.focus();
    textarea.selectionEnd = start + emoji.length;
    autoResize(textarea);
  }

  function toggleEmojiPicker() {
    pickerOpen = !pickerOpen;
    const picker = document.getElementById("emojiPicker");
    const btn = document.getElementById("emojiBtn");
    
    picker.classList.toggle("open", pickerOpen);
    btn.classList.toggle("active", pickerOpen);
  }

  // ==================== AVATAR & CHAT ====================
  const AVATARS = ["🐱","🐶","🐼","🐻","🦊","🐯","🐸","🐧","🦁","🐨","🐹","🐮","🐙","🦋","🐺","🦄"];
  let selectedAvatar = AVATARS[0];
  let currentUser = "";
  const userAvatarCache = {};
  let lastCount = 0;
  let isFetching = false;
  let pollTimer = null;

  function buildAvatarGrid() {
    const grid = document.getElementById("avatarGrid");
    grid.innerHTML = "";
    AVATARS.forEach((avatar, i) => {
      const div = document.createElement("div");
      div.className = `av-opt ${i === 0 ? "active" : ""}`;
      div.textContent = avatar;
      div.onclick = () => {
        selectedAvatar = avatar;
        document.querySelectorAll(".av-opt").forEach(el => el.classList.remove("active"));
        div.classList.add("active");
        document.getElementById("avatarPreview").textContent = avatar;
      };
      grid.appendChild(div);
    });
  }

  function enterChat() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return alert("Vui lòng nhập tên!");

    currentUser = name;
    document.getElementById("nameModal").style.display = "none";
    document.getElementById("headerAvatar").textContent = selectedAvatar;
    document.getElementById("userLabel").textContent = currentUser;

    fetchOnce();
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.3) + "px";
  }

  function containsChinese(text) {
    return /[\u4e00-\u9fff]/.test(text);
  }

  function buildMsgEl(msg) {
    const isMe = msg.user === currentUser;
    const div = document.createElement("div");
    div.className = `msg ${isMe ? "me" : "other"}`;

    if (!isMe) {
      const av = document.createElement("div");
      av.className = "msg-avatar";
      av.textContent = userAvatarCache[msg.user] || "👤";
      div.appendChild(av);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (!isMe) {
      const name = document.createElement("b");
      name.textContent = msg.user;
      bubble.appendChild(name);
    }

    bubble.appendChild(document.createTextNode(msg.message));

    if (containsChinese(msg.message)) {
      const translateBtn = document.createElement("div");
      translateBtn.className = "translate-btn";
      translateBtn.innerHTML = "🌐 Dịch sang tiếng Việt";
      translateBtn.onclick = () => translateText(msg.message, bubble, translateBtn);
      bubble.appendChild(translateBtn);
    }

    div.appendChild(bubble);
    return div;
  }

  function renderAll(data) {
    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = '<div class="date-divider"><span>Hôm nay</span></div>';
    data.forEach(msg => chatBox.appendChild(buildMsgEl(msg)));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function fetchOnce() {
    if (isFetching) return;
    isFetching = true;

    fetch(API_URL)
      .then(r => r.json())
      .then(data => {
        data.forEach(msg => {
          if (msg.avatar) userAvatarCache[msg.user] = msg.avatar;
        });

        if (data.length > lastCount) {
          if (lastCount === 0) renderAll(data);
          else {
            const chatBox = document.getElementById("chatBox");
            const wasAtBottom = chatBox.scrollHeight - chatBox.scrollTop < 100;
            data.slice(lastCount).forEach(msg => chatBox.appendChild(buildMsgEl(msg)));
            if (wasAtBottom) chatBox.scrollTop = chatBox.scrollHeight;
          }
          lastCount = data.length;
        }
      })
      .catch(() => {})
      .finally(() => {
        isFetching = false;
        pollTimer = setTimeout(fetchOnce, 2000);
      });
  }

  function send() {
    const input = document.getElementById("message");
    const text = input.value.trim();
    if (!text || !currentUser) return;

    const msgData = {
      user: currentUser,
      message: text,
      avatar: selectedAvatar
    };

    const chatBox = document.getElementById("chatBox");
    chatBox.appendChild(buildMsgEl(msgData));
    chatBox.scrollTop = chatBox.scrollHeight;

    input.value = "";
    autoResize(input);

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(msgData)
    }).catch(() => alert("Gửi tin nhắn thất bại!"));
  }

  function translateText(text, bubbleEl, btn) {
    btn.textContent = "⏳ Đang dịch...";
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=vi&dt=t&q=${encodeURIComponent(text)}`;
    
    fetch(url)
      .then(res => res.json())
      .then(data => {
        const translated = data[0].map(item => item[0]).join("");
        btn.remove();
        const result = document.createElement("div");
        result.className = "translate-result";
        result.textContent = "🇻🇳 " + translated;
        bubbleEl.appendChild(result);
      })
      .catch(() => btn.textContent = "❌ Không dịch được");
  }

  // ==================== INIT ====================
  window.onload = () => {
    buildEmojiPicker();
    buildAvatarGrid();

    document.getElementById("emojiBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleEmojiPicker();
    });

    document.getElementById("emojiPicker").addEventListener("click", e => e.stopPropagation());
  };
</script>
</body>
</html>
