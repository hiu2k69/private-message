<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VibeChat | AnhBaTalk</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --accent: #ffcc00; --bg: #020205;
            --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; height: 100dvh; overflow: hidden; }

        /* --- VŨ TRỤ BACKGROUND --- */
        .universe {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0d1117 0%, #020205 100%);
            overflow: hidden;
        }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--d) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        .nebula {
            position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.05) 0%, transparent 40%);
            filter: blur(80px); animation: drift 20s infinite linear;
        }
        @keyframes drift { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .welcome-text { font-size: 28px; font-weight: 800; color: var(--primary); display: flex; gap: 4px; }
        .welcome-text span { display: inline-block; transform: translateY(30px); opacity: 0; animation: jump 0.4s forwards; }
        @keyframes jump { to { transform: translateY(0); opacity: 1; } }

        /* --- PAGES --- */
        .app-shell { width: 100%; max-width: 450px; height: 100dvh; margin: 0 auto; position: relative; border-left: 1px solid var(--border); border-right: 1px solid var(--border); backdrop-filter: blur(10px); }
        .page { position: absolute; inset: 0; display: none; flex-direction: column; opacity: 0; transform: scale(0.95); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: flex; opacity: 1; transform: scale(1); z-index: 10; }

        /* --- AUTH & SETTINGS CARD --- */
        .glass-card {
            margin: auto; width: 90%; padding: 35px; background: var(--glass); 
            border: 1px solid var(--border); border-radius: 30px; backdrop-filter: blur(25px); text-align: center;
        }
        .input-box {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 15px; border-radius: 15px; color: white; margin-bottom: 12px; outline: none;
        }
        .btn-glow {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            background: linear-gradient(45deg, var(--primary), #4facfe);
            color: #000; font-weight: 700; cursor: pointer; transition: 0.3s;
        }

        /* --- CHAT COMPONENTS --- */
        .header { padding: 45px 20px 15px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .av-circle { width: 45px; height: 45px; border-radius: 50%; background: var(--glass); display: grid; place-items: center; font-size: 22px; border: 1px solid var(--border); cursor: pointer; }
        
        .chat-scroll { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg-wrap { display: flex; flex-direction: column; max-width: 85%; }
        .msg-me { align-self: flex-end; } .msg-other { align-self: flex-start; }

        .bubble { padding: 12px 16px; border-radius: 20px; font-size: 15px; position: relative; }
        .b-me { background: var(--primary); color: #000; border-bottom-right-radius: 4px; }
        .b-other { background: var(--glass); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        .trans-label { font-size: 11px; color: var(--primary); margin-top: 5px; cursor: pointer; font-weight: 700; }
        .trans-box { font-size: 13px; color: #ccc; margin-top: 5px; padding: 8px; border-left: 2px solid var(--accent); background: rgba(255,255,255,0.05); border-radius: 4px; display: none; }

        .chat-footer { padding: 15px; background: rgba(0,0,0,0.7); display: flex; gap: 10px; align-items: center; }
        .emoji-btn { font-size: 20px; cursor: pointer; opacity: 0.7; }
        
        /* EMOJI PICKER POPUP */
        #emojiPicker { 
            position: absolute; bottom: 80px; left: 20px; background: #1a1a20; 
            border: 1px solid var(--border); padding: 10px; border-radius: 15px;
            display: none; grid-template-columns: repeat(6, 1fr); gap: 10px; z-index: 100;
        }

        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; place-items: center; }
    </style>
</head>
<body>

<div class="universe" id="universe">
    <div class="nebula"></div>
</div>

<div id="splash">
    <div class="welcome-text" id="welcomeTxt"></div>
    <div id="eye" style="font-size: 50px; margin-top: 15px;">😎</div>
</div>

<div class="app-shell">
    
    <!-- TRANG LOGIN / REGISTER -->
    <div class="page" id="pageAuth">
        <div class="glass-card">
            <h1 style="font-size: 30px; margin-bottom: 20px; background: linear-gradient(to right, #00f2fe, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">VibeChat</h1>
            <input type="text" id="user" class="input-box" placeholder="Tên đăng nhập...">
            <input type="password" id="pass" class="input-box" placeholder="Mật khẩu...">
            
            <div id="regExtra" style="display:none; margin-bottom: 15px;">
                <p style="font-size:11px; color:var(--primary); margin-bottom:8px;">CHỌN ICON ĐẠI DIỆN:</p>
                <div style="display:flex; justify-content:center; gap:10px;" id="avSelect">
                    <div class="av-circle" onclick="pickAv(this)">🤵</div>
                    <div class="av-circle" onclick="pickAv(this)">😎</div>
                    <div class="av-circle" onclick="pickAv(this)">🦁</div>
                    <div class="av-circle" onclick="pickAv(this)">🐉</div>
                </div>
            </div>
            <button class="btn-glow" id="btnAuth" onclick="handleAuth()">XÁC NHẬN</button>
        </div>
    </div>

    <!-- TRANG SETTINGS (ĐỔI TÊN/ICON) -->
    <div class="page" id="pageSettings">
        <div class="header">
            <div onclick="changePage('inbox')" style="cursor:pointer">←</div>
            <b>Cài đặt tài khoản</b>
        </div>
        <div class="glass-card" style="margin-top:20px;">
            <p style="font-size:12px; margin-bottom:10px;">ĐỔI TÊN HIỂN THỊ:</p>
            <input type="text" id="newName" class="input-box">
            <p style="font-size:12px; margin-bottom:10px;">ĐỔI ICON:</p>
            <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;">
                <div class="av-circle" onclick="pickAv(this)">🤵</div>
                <div class="av-circle" onclick="pickAv(this)">🐱</div>
                <div class="av-circle" onclick="pickAv(this)">👽</div>
                <div class="av-circle" onclick="pickAv(this)">💎</div>
            </div>
            <button class="btn-glow" onclick="updateProfile()">LƯU THAY ĐỔI</button>
        </div>
    </div>

    <!-- TRANG INBOX -->
    <div class="page" id="pageInbox">
        <div class="header">
            <div class="av-circle" id="myAv" onclick="changePage('settings')">👤</div>
            <div style="flex:1"><b id="myName">...</b><div style="font-size:10px; color:var(--primary)">VŨ TRỤ TRỰC TUYẾN</div></div>
            <div onclick="logout()" style="font-size:11px; color:#ff4b4b; cursor:pointer">THOÁT</div>
        </div>
        <div id="inboxList" style="flex:1; overflow-y:auto;"></div>
    </div>

    <!-- TRANG CHAT -->
    <div class="page" id="pageChat">
        <div class="header">
            <div onclick="changePage('inbox')" style="cursor:pointer; font-size:20px;">←</div>
            <div class="av-circle" id="peerAv">👤</div>
            <b id="peerName">...</b>
        </div>
        <div id="chatBox" class="chat-scroll"></div>
        <div id="emojiPicker"></div>
        <div class="chat-footer">
            <div class="emoji-btn" onclick="toggleEmoji()">😊</div>
            <input type="text" id="msgInput" class="input-box" style="margin:0; flex:1;" placeholder="Gửi tín hiệu...">
            <button class="btn-glow" onclick="sendMsg()" style="width:50px; padding:10px;">🚀</button>
        </div>
    </div>
</div>

<div id="loader">🛸 ĐANG DI CHUYỂN...</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxHHt1ijMwnNbQAh5AB-QPP3Pg6b08-EpSW1DvbDAzM3egAASwU1gV-F1QeTZpn0bII/exec";
    let me = JSON.parse(localStorage.getItem('vibe_cosmic_user'));
    let timer = null;
    let selectedAv = "🤵";

    // --- KHỞI TẠO VŨ TRỤ ---
    function initUniverse() {
        const uv = document.getElementById('universe');
        for(let i=0; i<100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 3 + 'px';
            s.style.width = size; s.style.height = size;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            uv.appendChild(s);
        }
    }

    window.onload = () => {
        initUniverse();
        const txt = "Welcome to VibeChat | AnhBaTalk";
        const box = document.getElementById('welcomeTxt');
        txt.split('').forEach((c, i) => {
            const s = document.createElement('span');
            s.innerText = c === ' ' ? '\u00A0' : c;
            s.style.animationDelay = `${i * 0.03}s`;
            box.appendChild(s);
        });

        setTimeout(() => { document.getElementById('eye').innerText = "😉"; }, 1800);
        setTimeout(() => {
            document.getElementById('splash').style.transform = 'translateY(-100%)';
            if(me) { syncMe(); changePage('inbox'); } else { changePage('auth'); }
        }, 2800);

        initEmojis();
        document.getElementById('msgInput').addEventListener('keypress', e => e.key === 'Enter' && sendMsg());
    };

    // --- LOGIC TÀI KHOẢN ---
    function syncMe() {
        document.getElementById('myAv').innerText = me.avatar;
        document.getElementById('myName').innerText = me.name;
        document.getElementById('newName').value = me.name;
    }

    async function handleAuth() {
        const u = document.getElementById('user').value, p = document.getElementById('pass').value;
        if(!u || !p) return;
        document.getElementById('loader').style.display = 'grid';
        
        const res = await fetch(`${API}?action=login&user=${u}&pass=${p}`);
        const data = await res.json();
        if(data.ok) {
            me = { name: u, avatar: data.avatar || "🤵" };
            saveAndGo();
        } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('regExtra').style.display = 'block';
            if(document.getElementById('btnAuth').hasAttribute('data-reg')) {
                await fetch(API, { method:"POST", mode:"no-cors", body:JSON.stringify({action:"send", from:u, to:"SYS", message:"JOIN", avatar:selectedAv}) });
                me = { name: u, avatar: selectedAv }; saveAndGo();
            }
            document.getElementById('btnAuth').setAttribute('data-reg', 'true');
        }
    }

    function updateProfile() {
        me.name = document.getElementById('newName').value;
        me.avatar = selectedAv;
        localStorage.setItem('vibe_cosmic_user', JSON.stringify(me));
        syncMe();
        changePage('inbox');
    }

    function saveAndGo() {
        localStorage.setItem('vibe_cosmic_user', JSON.stringify(me));
        syncMe();
        document.getElementById('loader').style.display='none';
        changePage('inbox');
    }

    function logout() { localStorage.removeItem('vibe_cosmic_user'); location.reload(); }

    // --- CHAT & DỊCH ---
    async function loadInbox() {
        const res = await fetch(`${API}?action=contacts&user=${me.name}`);
        const data = await res.json();
        document.getElementById('inboxList').innerHTML = data.filter(c => c.name !== me.name && c.lastMsg).map(c => `
            <div style="display:flex; padding:18px; border-bottom:1px solid var(--border); gap:12px; cursor:pointer" onclick="openChat('${c.name}','${c.avatar}')">
                <div class="av-circle">${c.avatar || '👤'}</div>
                <div style="flex:1"><b>${c.name}</b><p style="font-size:12px; color:#888; margin-top:4px;">${c.lastMsg}</p></div>
            </div>
        `).join('');
    }

    let activePeer = null;
    function openChat(name, av) {
        activePeer = { name, av };
        document.getElementById('peerName').innerText = name;
        document.getElementById('peerAv').innerText = av || '👤';
        changePage('chat');
        syncMsgs();
        timer = setInterval(syncMsgs, 3000);
    }

    async function syncMsgs() {
        const res = await fetch(`${API}?action=messages&user=${me.name}&peer=${activePeer.name}`);
        const data = await res.json();
        document.getElementById('chatBox').innerHTML = data.map(m => {
            const isMe = m.from === me.name;
            // Dịch thuật: Kiểm tra nếu không có ký tự Latin mở rộng (dấu tiếng Việt)
            const isForeign = !/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(m.message);
            return `
                <div class="msg-wrap ${isMe ? 'msg-me' : 'msg-other'}">
                    <div class="bubble ${isMe ? 'b-me' : 'b-other'}">${m.message}</div>
                    ${!isMe && isForeign ? `<div class="trans-label" onclick="doTranslate(this, '${encodeURIComponent(m.message)}')">✨ Dịch nhanh</div>` : ''}
                    <div class="trans-box"></div>
                </div>
            `;
        }).join('');
        const b = document.getElementById('chatBox'); b.scrollTop = b.scrollHeight;
    }

    async function doTranslate(btn, txt) {
        const box = btn.nextElementSibling;
        box.style.display = 'block'; box.innerText = "Đang giải mã...";
        try {
            // Sử dụng MyMemory API (đã check lại logic)
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${txt}&langpair=auto|vi`);
            const data = await res.json();
            box.innerText = data.responseData.translatedText;
            btn.style.display = 'none';
        } catch(e) { box.innerText = "Lỗi kết nối vệ tinh!"; }
    }

    async function sendMsg() {
        const i = document.getElementById('msgInput'), v = i.value.trim();
        if(!v) return; i.value = "";
        document.getElementById('emojiPicker').style.display = 'none';
        await fetch(API, { method:"POST", mode:"no-cors", body:JSON.stringify({action:"send", from:me.name, to:activePeer.name, message:v, avatar:me.avatar}) });
        syncMsgs();
    }

    // --- TIỆN ÍCH ---
    function pickAv(el) {
        document.querySelectorAll('.av-circle').forEach(i => i.style.borderColor = 'var(--border)');
        el.style.borderColor = 'var(--accent)';
        selectedAv = el.innerText;
    }

    function initEmojis() {
        const ems = ['😊','😂','❤️','😍','👍','🔥','🙌','✨','😎','😭','🤔','🚀'];
        const p = document.getElementById('emojiPicker');
        ems.forEach(e => {
            const s = document.createElement('span');
            s.innerText = e; s.style.cursor = 'pointer';
            s.onclick = () => document.getElementById('msgInput').value += e;
            p.appendChild(s);
        });
    }

    function toggleEmoji() {
        const p = document.getElementById('emojiPicker');
        p.style.display = p.style.display === 'grid' ? 'none' : 'grid';
    }

    function changePage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const p = document.getElementById('page' + id.charAt(0).toUpperCase() + id.slice(1));
        p.style.display = 'flex';
        setTimeout(() => p.classList.add('active'), 50);
        if(id === 'inbox') loadInbox();
        if(id !== 'chat') clearInterval(timer);
    }
</script>
</body>
</html>
