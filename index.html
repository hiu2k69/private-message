<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat</title>
    <link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqNphFfOi0lrv_ZR-_vPScPNFzDFoUz4Agww&s">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0f14;
      --surface: #16181f;
      --surface2: #1d1f29;
      --border: rgba(255,255,255,0.06);
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --me-bg: linear-gradient(135deg, #7c6af7, #a78bfa);
      --other-bg: #1d1f29;
      --text: #e8e9f0;
      --muted: #6b6d80;
      --name-color: #a78bfa;
      --radius: 18px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before { width:400px; height:400px; background:rgba(124,106,247,.12); top:-100px; left:-100px; }
    body::after  { width:300px; height:300px; background:rgba(167,139,250,.08); bottom:-80px; right:-80px; }

    .wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px; height: 100vh;
      display: flex; flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Header */
    .header {
      padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,15,20,.85);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .header-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--me-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent);
      transition: transform .18s; user-select: none;
    }
    .header-info { flex: 1 }
    .header-title { font-size: 15px; font-weight: 600; letter-spacing: .01em; }
    .header-sub   { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
    .live-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #4ade80; margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.85); }
    }

    /* Chat */
    #chatBox {
      flex: 1; overflow-y: auto;
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 6px;
      scroll-behavior: smooth;
    }
    #chatBox::-webkit-scrollbar { width: 3px; }
    #chatBox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      display: flex; align-items: flex-end; gap: 7px;
      max-width: 80%;
      animation: msgIn .25s cubic-bezier(.34,1.5,.64,1) both;
    }
    @keyframes msgIn {
      from { opacity:0; transform:translateY(10px) scale(.96); }
      to   { opacity:1; transform:none; }
    }
    .msg.me    { align-self:flex-end;  flex-direction:row-reverse; }
    .msg.other { align-self:flex-start; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .bubble {
      padding: 10px 14px; border-radius: var(--radius);
      font-size: 14px; line-height: 1.55; word-break: break-word;
    }
    .msg.me    .bubble {
      background: var(--me-bg); color: #fff;
      border-bottom-right-radius: var(--radius-sm);
      box-shadow: 0 4px 20px rgba(124,106,247,.35);
    }
    .msg.other .bubble {
      background: var(--other-bg); color: var(--text);
      border-bottom-left-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .bubble b {
      display: block; font-size: 11.5px; font-weight: 600;
      color: var(--name-color); margin-bottom: 4px; letter-spacing: .02em;
    }
    .translate-btn {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 7px; font-size: 11.5px; color: var(--muted);
      cursor: pointer; transition: color .2s; user-select: none;
    }
    .translate-btn:hover { color: var(--accent2); }
    .translate-result {
      margin-top: 6px; font-size: 12px;
      color: rgba(255,255,255,.55);
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 5px; line-height: 1.5;
    }
    .msg.me .translate-result { color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.15); }

    .date-divider {
      text-align:center; font-size:11px; color:var(--muted);
      margin:10px 0; position:relative;
    }
    .date-divider span { background:var(--bg); padding:0 10px; position:relative; z-index:1; }
    .date-divider::before {
      content:''; position:absolute;
      top:50%; left:0; right:0; height:1px; background:var(--border);
    }

    /* Input */
    .input-area {
      padding: 12px 14px 16px;
      border-top: 1px solid var(--border);
      background: rgba(14,15,20,.9);
      backdrop-filter: blur(12px);
      display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0;
    }
    #message {
      flex: 1; background: var(--surface2);
      border: 1px solid var(--border); border-radius: 14px;
      color: var(--text); font-family: inherit; font-size: 14px;
      padding: 10px 14px; outline: none; resize: none;
      max-height: 120px; line-height: 1.5;
      transition: border-color .2s, box-shadow .2s;
    }
    #message::placeholder { color: var(--muted); }
    #message:focus { border-color:rgba(124,106,247,.5); box-shadow:0 0 0 3px rgba(124,106,247,.1); }
    .send-btn {
      width:40px; height:40px; border-radius:12px;
      background:var(--me-bg); border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:opacity .2s,transform .15s;
      box-shadow:0 4px 14px rgba(124,106,247,.4);
    }
    .send-btn:hover  { opacity:.9; transform:scale(1.05); }
    .send-btn:active { transform:scale(.95); }
    .send-btn svg { width:18px; height:18px; fill:#fff; }

    /* Modal */
    .modal-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,.7); backdrop-filter:blur(8px);
      z-index:100; display:flex; align-items:center; justify-content:center;
    }
    .modal {
      background:var(--surface); border:1px solid var(--border);
      border-radius:24px; padding:28px 24px 24px;
      width:340px; text-align:center;
      animation:modalIn .3s cubic-bezier(.34,1.4,.64,1);
      max-height: 90vh; overflow-y: auto;
    }
    .modal::-webkit-scrollbar { width:3px; }
    .modal::-webkit-scrollbar-thumb { background:var(--border); }
    @keyframes modalIn {
      from { opacity:0; transform:scale(.9) translateY(20px); }
      to   { opacity:1; transform:none; }
    }
    .modal-logo {
      font-family:'Playfair Display',serif; font-style:italic;
      font-size:26px;
      background:var(--me-bg); -webkit-background-clip:text;
      -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:4px;
    }
    .modal-sub { color:var(--muted); font-size:13px; margin-bottom:20px; }

    /* Avatar preview */
    .avatar-preview {
      width:72px; height:72px; border-radius:50%;
      background:var(--me-bg);
      display:flex; align-items:center; justify-content:center;
      font-size:36px;
      margin:0 auto 18px;
      box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent);
    }
    .avatar-preview.pop { animation:avPop .25s cubic-bezier(.34,1.7,.64,1); }
    @keyframes avPop {
      from { transform:scale(.8); }
      to   { transform:scale(1); }
    }

    .section-label {
      font-size:11px; color:var(--muted);
      text-align:left; margin-bottom:9px;
      letter-spacing:.06em; text-transform:uppercase;
    }

    /* Avatar grid */
    .avatar-grid {
      display:grid; grid-template-columns:repeat(8,1fr);
      gap:5px; margin-bottom:20px;
    }
    .av-opt {
      aspect-ratio:1; border-radius:50%;
      background:var(--surface2); border:2px solid transparent;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; cursor:pointer;
      transition:transform .15s,border-color .15s,background .15s;
      user-select:none;
    }
    .av-opt:hover  { transform:scale(1.15); background:#2a2d3a; }
    .av-opt.active {
      border-color:var(--accent);
      background:rgba(124,106,247,.2);
      transform:scale(1.12);
    }

    /* Name input */
    .modal-input {
      width:100%; background:var(--surface2);
      border:1px solid var(--border); border-radius:12px;
      padding:11px 14px; font-family:inherit; font-size:14px;
      color:var(--text); outline:none; margin-bottom:14px;
      transition:border-color .2s; text-align:left; display:block;
    }
    .modal-input:focus { border-color:rgba(124,106,247,.5); }
    .modal-input::placeholder { color:var(--muted); }

    .modal-btn {
      width:100%; padding:12px; border:none; border-radius:12px;
      background:var(--me-bg); color:#fff;
      font-family:inherit; font-size:14px; font-weight:600;
      cursor:pointer; transition:opacity .2s,transform .15s;
      box-shadow:0 4px 18px rgba(124,106,247,.4);
    }
    .modal-btn:hover  { opacity:.9; }
    .modal-btn:active { transform:scale(.98); }
  </style>
</head>
<body>

<!-- Setup modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <div class="modal-logo">Kết nối</div>
    <div class="modal-sub">Chọn avatar và nhập tên của bạn</div>

    <div class="avatar-preview" id="avatarPreview">🐱</div>

    <div class="section-label">Chọn avatar</div>
    <div class="avatar-grid" id="avatarGrid"></div>

    <div class="section-label">Tên của bạn</div>
    <input type="text" class="modal-input" id="nameInput" placeholder="Nhập tên..." maxlength="30" />

    <button class="modal-btn" onclick="enterChat()">Vào chat →</button>
  </div>
</div>

<!-- Chat -->
<div class="wrapper">
  <div class="header">
    <div class="header-avatar" id="headerAvatar">🐱</div>
    <div class="header-info">
      <div class="header-title" id="userLabel">Đang kết nối...</div>
      <div class="header-sub"><span class="live-dot"></span>Trực tuyến</div>
    </div>
  </div>

  <div id="chatBox">
    <div class="date-divider"><span>Hôm nay</span></div>
  </div>

  <div class="input-area">
    <textarea id="message" placeholder="Nhắn gì đó..." rows="1"
      oninput="autoResize(this)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
    ></textarea>
    <button class="send-btn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwM2DOrKYnNAkbOZ3lvT1PKyTc1dcie0Q2-nW-0I6Pdc5EopP1GT96q8ek8AvcymLN0/exec";

  const AVATARS = [
    "🐱","🐶","🐼","🐻","🦊","🐯","🐸","🐧",
    "🦁","🐨","🐹","🐮","🐙","🦋","🐺","🦄",
    "🌸","🌻","⭐","🌙","🔥","💎","🎵","🍀",
    "🎃","👻","🤖","👾","🦸","🧙","🧜","🧚",
  ];

  let selectedAvatar = AVATARS[0];
  let currentUser = "";

  // Build grid
  const grid = document.getElementById("avatarGrid");
  AVATARS.forEach((em, i) => {
    const el = document.createElement("div");
    el.className = "av-opt" + (i === 0 ? " active" : "");
    el.textContent = em;
    el.onclick = () => {
      selectedAvatar = em;
      document.querySelectorAll(".av-opt").forEach(e => e.classList.remove("active"));
      el.classList.add("active");
      const preview = document.getElementById("avatarPreview");
      preview.textContent = em;
      preview.classList.remove("pop");
      void preview.offsetWidth;
      preview.classList.add("pop");
    };
    grid.appendChild(el);
  });

  document.getElementById("nameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") enterChat();
  });

  function enterChat() {
    const val = document.getElementById("nameInput").value.trim();
    if (!val) { document.getElementById("nameInput").focus(); return; }
    currentUser = val;
    document.getElementById("nameModal").style.display = "none";
    document.getElementById("headerAvatar").textContent = selectedAvatar;
    document.getElementById("userLabel").textContent = currentUser;
    loadMessages();
    setInterval(loadMessages, 1500);
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  function containsChinese(text) {
    return /[\u4e00-\u9fff]/.test(text);
  }

  function send() {
    const message = document.getElementById("message").value.trim();
    if (!message || !currentUser) return;
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ user: currentUser, message, avatar: selectedAvatar })
    });
    const el = document.getElementById("message");
    el.value = "";
    el.style.height = "auto";
  }

  function translateText(text, el, btn) {
    btn.textContent = "⏳ Đang dịch...";
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=vi&dt=t&q=${encodeURIComponent(text)}`;
    fetch(url)
      .then(r => r.json())
      .then(data => {
        btn.remove();
        // Google trả về mảng lồng nhau, ghép lại các đoạn
        const translated = data[0].map(seg => seg[0]).join("");
        const div = document.createElement("div");
        div.className = "translate-result";
        div.textContent = "🇻🇳 " + translated;
        el.appendChild(div);
      })
      .catch(() => {
        btn.textContent = "❌ Dịch thất bại, thử lại";
      });
  }

  const userAvatarCache = {};
  let lastCount = 0;

  function loadMessages() {
    fetch(API_URL)
      .then(r => r.json())
      .then(data => {
        if (data.length === lastCount) return;
        lastCount = data.length;

        data.forEach(msg => {
          if (msg.avatar) userAvatarCache[msg.user] = msg.avatar;
        });

        const chatBox = document.getElementById("chatBox");
        const wasAtBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 60;

        chatBox.innerHTML = '<div class="date-divider"><span>Hôm nay</span></div>';

        data.forEach(msg => {
          const isMe = msg.user === currentUser;
          const avatar = isMe ? selectedAvatar : (userAvatarCache[msg.user] || "👤");

          const div = document.createElement("div");
          div.className = "msg " + (isMe ? "me" : "other");

          if (!isMe) {
            const avEl = document.createElement("div");
            avEl.className = "msg-avatar";
            avEl.textContent = avatar;
            div.appendChild(avEl);
          }

          const bubble = document.createElement("div");
          bubble.className = "bubble";

          if (!isMe) {
            const nameEl = document.createElement("b");
            nameEl.textContent = msg.user;
            bubble.appendChild(nameEl);
          }

          bubble.appendChild(document.createTextNode(msg.message));

          if (containsChinese(msg.message)) {
            const btn = document.createElement("div");
            btn.className = "translate-btn";
            btn.innerHTML = "🌐 Dịch sang tiếng Việt";
            btn.onclick = () => translateText(msg.message, bubble, btn);
            bubble.appendChild(btn);
          }

          div.appendChild(bubble);
          chatBox.appendChild(div);
        });

        if (wasAtBottom) chatBox.scrollTop = chatBox.scrollHeight;
      });
  }
</script>
</body>
</html>
