<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VibeChat | AnhBaTalk</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe; --accent: #ffcc00; --bg: #020205;
            --glass: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.12);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Chống cuộn toàn trang để tạo cảm giác App native */
        body { 
            background: var(--bg); 
            color: #fff; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- VŨ TRỤ BACKGROUND --- */
        .universe {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0d1117 0%, #020205 100%);
        }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--d) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        /* --- VỎ BỌC APP (RESPONSIVE CHÍNH) --- */
        .app-shell { 
            width: 100%; 
            max-width: 500px; /* Chiều rộng tối đa trên PC */
            height: 100dvh; 
            position: relative; 
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--border); 
            border-right: 1px solid var(--border);
            display: flex; 
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        /* Media Query cho màn hình lớn (Desktop) */
        @media (min-width: 768px) {
            .app-shell {
                height: 90vh;
                border-radius: 30px;
                border: 1px solid var(--border);
            }
            body { background: #000; } /* Nền ngoài tối hơn trên PC */
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .welcome-text { font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 800; color: var(--primary); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 0 20px; }
        .welcome-text span { display: inline-block; transform: translateY(30px); opacity: 0; animation: jump 0.4s forwards; }
        @keyframes jump { to { transform: translateY(0); opacity: 1; } }

        /* --- TRANG --- */
        .page { position: absolute; inset: 0; display: none; flex-direction: column; opacity: 0; transition: 0.4s ease; }
        .page.active { display: flex; opacity: 1; z-index: 10; }

        /* --- HEADER (Tối ưu tai thỏ) --- */
        .header { 
            padding: calc(var(--safe-top) + 20px) 20px 15px; 
            background: rgba(0,0,0,0.5); 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
        }

        /* --- CHAT AREA --- */
        .chat-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            -webkit-overflow-scrolling: touch; /* Cuộn mượt trên iOS */
        }

        .bubble { 
            padding: 12px 16px; 
            border-radius: 18px; 
            font-size: 15px; 
            max-width: 85%;
            word-wrap: break-word; /* Chống tràn chữ dài */
        }
        .b-me { background: var(--primary); color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
        .b-other { background: var(--glass); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        /* --- FOOTER (Tối ưu bàn phím di động) --- */
        .chat-footer { 
            padding: 15px 20px calc(var(--safe-bottom) + 15px); 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }

        /* UI ELEMENTS */
        .glass-card {
            margin: auto; width: 90%; padding: clamp(20px, 5vw, 35px); 
            background: var(--glass); border: 1px solid var(--border); 
            border-radius: 25px; backdrop-filter: blur(25px); text-align: center;
        }
        .input-box {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            padding: 14px; border-radius: 12px; color: white; margin-bottom: 12px; outline: none; font-size: 16px; /* Font 16px tránh iOS tự động zoom khi focus */
        }
        .btn-glow {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(45deg, var(--primary), #4facfe);
            color: #000; font-weight: 700; cursor: pointer;
        }

        /* EMOJI PICKER RESPONSIVE */
        #emojiPicker { 
            position: absolute; bottom: 90px; left: 10px; right: 10px;
            background: #1a1a20; border: 1px solid var(--border); 
            padding: 15px; border-radius: 20px;
            display: none; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 10px; z-index: 100;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }

        #loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; place-items: center; }
    </style>
</head>
<body>

<div class="universe" id="universe"></div>

<!-- SPLASH SCREEN -->
<div id="splash">
    <div class="welcome-text" id="welcomeTxt"></div>
    <div id="eye" style="font-size: 60px; margin-top: 15px;">😎</div>
</div>

<div class="app-shell">
    <!-- TRANG LOGIN -->
    <div class="page" id="pageAuth">
        <div class="glass-card">
            <h1 style="font-size: clamp(24px, 8vw, 32px); margin-bottom: 20px; color: var(--primary);">VibeChat</h1>
            <input type="text" id="user" class="input-box" placeholder="Tên đăng nhập">
            <input type="password" id="pass" class="input-box" placeholder="Mật khẩu">
            <div id="regExtra" style="display:none; margin-bottom: 15px;">
                <p style="font-size:11px; color:var(--primary); margin-bottom:8px;">CHỌN ICON ĐẠI DIỆN:</p>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <div class="av-item" style="cursor:pointer; font-size:24px;" onclick="pickAv(this)">🤵</div>
                    <div class="av-item" style="cursor:pointer; font-size:24px;" onclick="pickAv(this)">😎</div>
                    <div class="av-item" style="cursor:pointer; font-size:24px;" onclick="pickAv(this)">🦁</div>
                    <div class="av-item" style="cursor:pointer; font-size:24px;" onclick="pickAv(this)">🐉</div>
                </div>
            </div>
            <button class="btn-glow" id="btnAuth" onclick="handleAuth()">XÁC NHẬN</button>
        </div>
    </div>

    <!-- TRANG SETTINGS -->
    <div class="page" id="pageSettings">
        <div class="header">
            <div onclick="changePage('inbox')" style="cursor:pointer; font-size:20px;">←</div>
            <b>Cài đặt</b>
        </div>
        <div class="glass-card" style="margin-top:20px;">
            <input type="text" id="newName" class="input-box" placeholder="Đổi tên hiển thị">
            <div style="display:flex; justify-content:center; gap:15px; margin: 20px 0;">
                <div onclick="pickAv(this)" style="cursor:pointer; font-size:30px;">🐱</div>
                <div onclick="pickAv(this)" style="cursor:pointer; font-size:30px;">👽</div>
                <div onclick="pickAv(this)" style="cursor:pointer; font-size:30px;">🤖</div>
                <div onclick="pickAv(this)" style="cursor:pointer; font-size:30px;">💎</div>
            </div>
            <button class="btn-glow" onclick="updateProfile()">LƯU THAY ĐỔI</button>
        </div>
    </div>

    <!-- TRANG INBOX -->
    <div class="page" id="pageInbox">
        <div class="header">
            <div id="myAv" onclick="changePage('settings')" style="width:45px; height:45px; border-radius:50%; background:var(--glass); display:grid; place-items:center; font-size:22px; cursor:pointer; border:1px solid var(--border);">👤</div>
            <div style="flex:1"><b id="myName">...</b><div style="font-size:10px; color:var(--primary)">VŨ TRỤ TRỰC TUYẾN</div></div>
            <div onclick="logout()" style="font-size:12px; color:#ff4b4b; font-weight:bold; cursor:pointer">THOÁT</div>
        </div>
        <div id="inboxList" style="flex:1; overflow-y:auto;"></div>
    </div>

    <!-- TRANG CHAT -->
    <div class="page" id="pageChat">
        <div class="header">
            <div onclick="changePage('inbox')" style="cursor:pointer; font-size:24px;">←</div>
            <div id="peerAv" style="width:40px; height:40px; border-radius:50%; background:var(--glass); display:grid; place-items:center; border:1px solid var(--border);">👤</div>
            <b id="peerName">...</b>
        </div>
        <div id="chatBox" class="chat-scroll"></div>
        <div id="emojiPicker"></div>
        <div class="chat-footer">
            <div style="font-size:24px; cursor:pointer;" onclick="toggleEmoji()">😊</div>
            <input type="text" id="msgInput" class="input-box" style="margin:0; flex:1;" placeholder="Gửi tin nhắn...">
            <button class="btn-glow" onclick="sendMsg()" style="width:55px; padding:12px;">🚀</button>
        </div>
    </div>
</div>

<div id="loader">🚀 ĐANG KẾT NỐI...</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxHHt1ijMwnNbQAh5AB-QPP3Pg6b08-EpSW1DvbDAzM3egAASwU1gV-F1QeTZpn0bII/exec";
    let me = JSON.parse(localStorage.getItem('vibe_cosmic_user'));
    let timer = null, selectedAv = "🤵";

    // Khởi tạo sao băng
    function initUniverse() {
        const uv = document.getElementById('universe');
        for(let i=0; i<80; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() * 2 + 1 + 'px';
            s.style.width = size; s.style.height = size;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            s.style.setProperty('--d', Math.random() * 3 + 2 + 's');
            uv.appendChild(s);
        }
    }

    window.onload = () => {
        initUniverse();
        const txt = "Welcome to VibeChat | AnhBaTalk";
        const box = document.getElementById('welcomeTxt');
        txt.split('').forEach((c, i) => {
            const s = document.createElement('span');
            s.innerText = c === ' ' ? '\u00A0' : c;
            s.style.animationDelay = `${i * 0.03}s`;
            box.appendChild(s);
        });

        setTimeout(() => { document.getElementById('eye').innerText = "😉"; }, 1500);
        setTimeout(() => {
            document.getElementById('splash').style.transform = 'translateY(-100%)';
            if(me) { syncMe(); changePage('inbox'); } else { changePage('auth'); }
        }, 2500);

        initEmojis();
        document.getElementById('msgInput').addEventListener('keypress', e => e.key === 'Enter' && sendMsg());
    };

    function changePage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        const p = document.getElementById('page' + id.charAt(0).toUpperCase() + id.slice(1));
        p.style.display = 'flex';
        setTimeout(() => p.classList.add('active'), 50);
        if(id === 'inbox') loadInbox();
        if(id !== 'chat') clearInterval(timer);
    }

    async function handleAuth() {
        const u = document.getElementById('user').value, p = document.getElementById('pass').value;
        if(!u || !p) return;
        document.getElementById('loader').style.display = 'grid';
        const res = await fetch(`${API}?action=login&user=${u}&pass=${p}`);
        const data = await res.json();
        if(data.ok) {
            me = { name: u, avatar: data.avatar || "🤵" };
            saveUser();
        } else {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('regExtra').style.display = 'block';
            if(document.getElementById('btnAuth').hasAttribute('data-reg')) {
                await fetch(API, { method:"POST", mode:"no-cors", body:JSON.stringify({action:"send", from:u, to:"SYS", message:"JOIN", avatar:selectedAv}) });
                me = { name: u, avatar: selectedAv }; saveUser();
            }
            document.getElementById('btnAuth').setAttribute('data-reg', 'true');
        }
    }

    function saveUser() {
        localStorage.setItem('vibe_cosmic_user', JSON.stringify(me));
        syncMe(); document.getElementById('loader').style.display='none'; changePage('inbox');
    }

    function syncMe() {
        document.getElementById('myAv').innerText = me.avatar;
        document.getElementById('myName').innerText = me.name;
    }

    function updateProfile() {
        const n = document.getElementById('newName').value;
        if(n) me.name = n;
        me.avatar = selectedAv;
        localStorage.setItem('vibe_cosmic_user', JSON.stringify(me));
        syncMe(); changePage('inbox');
    }

    function logout() { localStorage.removeItem('vibe_cosmic_user'); location.reload(); }

    async function loadInbox() {
        const res = await fetch(`${API}?action=contacts&user=${me.name}`);
        const data = await res.json();
        document.getElementById('inboxList').innerHTML = data.filter(c => c.name !== me.name && c.lastMsg).map(c => `
            <div style="display:flex; padding:18px; border-bottom:1px solid var(--border); gap:12px; cursor:pointer" onclick="openChat('${c.name}','${c.avatar}')">
                <div style="width:48px; height:48px; border-radius:50%; background:var(--glass); display:grid; place-items:center; font-size:20px; border:1px solid var(--border);">${c.avatar || '👤'}</div>
                <div style="flex:1"><b>${c.name}</b><p style="font-size:12px; color:#888; margin-top:4px;">${c.lastMsg}</p></div>
            </div>
        `).join('');
    }

    let activePeer = null;
    function openChat(name, av) {
        activePeer = { name, av };
        document.getElementById('peerName').innerText = name;
        document.getElementById('peerAv').innerText = av || '👤';
        changePage('chat');
        syncMsgs();
        timer = setInterval(syncMsgs, 3000);
    }

    async function syncMsgs() {
        const res = await fetch(`${API}?action=messages&user=${me.name}&peer=${activePeer.name}`);
        const data = await res.json();
        document.getElementById('chatBox').innerHTML = data.map(m => {
            const isMe = m.from === me.name;
            const isForeign = !/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(m.message);
            return `
                <div style="display:flex; flex-direction:column; ${isMe ? 'align-items:flex-end' : 'align-items:flex-start'}">
                    <div class="bubble ${isMe ? 'b-me' : 'b-other'}">${m.message}</div>
                    ${!isMe && isForeign ? `<div style="font-size:10px; color:var(--primary); cursor:pointer; margin-top:5px;" onclick="doTrans(this, '${encodeURIComponent(m.message)}')">✨ Dịch nhanh</div>` : ''}
                    <div style="font-size:13px; color:#ccc; margin-top:5px; padding:8px; border-left:2px solid var(--accent); background:rgba(255,255,255,0.05); border-radius:8px; display:none;"></div>
                </div>
            `;
        }).join('');
        const b = document.getElementById('chatBox'); b.scrollTop = b.scrollHeight;
    }

    async function doTrans(btn, txt) {
        const box = btn.nextElementSibling; box.style.display = 'block'; box.innerText = "Đang giải mã...";
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${txt}&langpair=auto|vi`);
        const data = await res.json();
        box.innerText = data.responseData.translatedText; btn.style.display = 'none';
    }

    async function sendMsg() {
        const i = document.getElementById('msgInput'), v = i.value.trim();
        if(!v) return; i.value = "";
        document.getElementById('emojiPicker').style.display = 'none';
        await fetch(API, { method:"POST", mode:"no-cors", body:JSON.stringify({action:"send", from:me.name, to:activePeer.name, message:v, avatar:me.avatar}) });
        syncMsgs();
    }

    function initEmojis() {
        const ems = ['😊','😂','❤️','😍','👍','🔥','✨','😎','😭','🚀','🦁','🐲'];
        const p = document.getElementById('emojiPicker');
        ems.forEach(e => {
            const s = document.createElement('span');
            s.innerText = e; s.style.cssText = "cursor:pointer; font-size:24px; text-align:center;";
            s.onclick = () => document.getElementById('msgInput').value += e;
            p.appendChild(s);
        });
    }

    function toggleEmoji() {
        const p = document.getElementById('emojiPicker');
        p.style.display = p.style.display === 'grid' ? 'none' : 'grid';
    }

    function pickAv(el) { selectedAv = el.innerText; el.parentElement.querySelectorAll('div').forEach(d => d.style.opacity = '0.5'); el.style.opacity = '1'; }
</script>
</body>
</html>
