<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0f14;
      --surface: #16181f;
      --surface2: #1d1f29;
      --border: rgba(255,255,255,0.06);
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --me-bg: linear-gradient(135deg, #7c6af7, #a78bfa);
      --other-bg: #1d1f29;
      --text: #e8e9f0;
      --muted: #6b6d80;
      --name-color: #a78bfa;
      --radius: 18px;
      --radius-sm: 10px;
      /* safe area for notch/home-bar */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      /* dvh = dynamic viewport height → shrinks when mobile browser chrome appears */
      min-height: 100dvh;
    }

    body {
      background: var(--bg);
      font-family: 'Be Vietnam Pro', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before { width:400px; height:400px; background:rgba(124,106,247,.12); top:-100px; left:-100px; }
    body::after  { width:300px; height:300px; background:rgba(167,139,250,.08); bottom:-80px; right:-80px; }

    /* ── Main wrapper ──
       On desktop: card with max-width.
       On mobile: full screen, respects safe areas.
    */
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      /* Use dvh so it shrinks when keyboard appears */
      height: 100dvh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      /* Push content below notch */
      padding-top: var(--safe-top);
    }

    /* ── Header ── */
    .header {
      padding: 14px 18px;
      padding-left: calc(18px + var(--safe-left));
      padding-right: calc(18px + var(--safe-right));
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,15,20,.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex-shrink: 0;
    }
    .header-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--me-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent);
      user-select: none;
    }
    .header-info { flex: 1; min-width: 0; }
    .header-title {
      font-size: 15px; font-weight: 600; letter-spacing: .01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
    .live-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: #4ade80; margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.85); }
    }

    /* ── Chat area ── */
    #chatBox {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: contain;
      padding: 16px 14px;
      padding-left: calc(14px + var(--safe-left));
      padding-right: calc(14px + var(--safe-right));
      display: flex;
      flex-direction: column;
      gap: 5px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    #chatBox::-webkit-scrollbar { width: 3px; }
    #chatBox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Messages ── */
    .msg {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      max-width: 82%;
      animation: msgIn .22s cubic-bezier(.34,1.5,.64,1) both;
    }
    @keyframes msgIn {
      from { opacity:0; transform:translateY(8px) scale(.97); }
      to   { opacity:1; transform:none; }
    }
    .msg.me    { align-self:flex-end;  flex-direction:row-reverse; }
    .msg.other { align-self:flex-start; }

    /* On very small screens, allow wider bubbles */
    @media (max-width: 360px) {
      .msg { max-width: 90%; }
    }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
      /* hide on very small screens to save space */
    }
    @media (max-width: 320px) {
      .msg-avatar { display: none; }
    }

    .bubble {
      padding: 9px 13px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      /* prevent bubble from overflowing */
      min-width: 0;
      overflow-wrap: anywhere;
    }
    @media (max-width: 360px) {
      .bubble { font-size: 13px; padding: 8px 11px; }
    }

    .msg.me .bubble {
      background: var(--me-bg); color: #fff;
      border-bottom-right-radius: var(--radius-sm);
      box-shadow: 0 4px 20px rgba(124,106,247,.3);
    }
    .msg.other .bubble {
      background: var(--other-bg); color: var(--text);
      border-bottom-left-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .bubble b {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--name-color); margin-bottom: 3px; letter-spacing: .02em;
    }
    .translate-btn {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 7px; font-size: 11.5px; color: var(--muted);
      cursor: pointer; transition: color .2s; user-select: none;
      /* bigger touch target */
      padding: 2px 0;
    }
    .translate-btn:hover { color: var(--accent2); }
    .translate-result {
      margin-top: 6px; font-size: 12px;
      color: rgba(255,255,255,.55);
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 5px; line-height: 1.5;
    }
    .msg.me .translate-result { color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.15); }

    .date-divider {
      text-align:center; font-size:11px; color:var(--muted);
      margin:8px 0; position:relative; flex-shrink: 0;
    }
    .date-divider span { background:var(--bg); padding:0 10px; position:relative; z-index:1; }
    .date-divider::before {
      content:''; position:absolute;
      top:50%; left:0; right:0; height:1px; background:var(--border);
    }

    /* ── Input area ──
       Sticks above the keyboard on iOS/Android.
       padding-bottom uses safe-area so it doesn't hide behind home bar.
    */
    .input-area {
      padding: 10px 12px;
      padding-left: calc(12px + var(--safe-left));
      padding-right: calc(12px + var(--safe-right));
      padding-bottom: calc(10px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: rgba(14,15,20,.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: flex-end;
      gap: 9px;
      flex-shrink: 0;
    }
    #message {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 16px; /* 16px prevents iOS zoom on focus */
      padding: 9px 13px;
      outline: none;
      resize: none;
      /* cap height but allow growth */
      max-height: 30dvh;
      line-height: 1.5;
      transition: border-color .2s, box-shadow .2s;
    }
    #message::placeholder { color: var(--muted); }
    #message:focus {
      border-color: rgba(124,106,247,.5);
      box-shadow: 0 0 0 3px rgba(124,106,247,.1);
    }

    /* larger touch target on mobile */
    .send-btn {
      width: 44px; height: 44px;
      border-radius: 13px;
      background: var(--me-bg);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 14px rgba(124,106,247,.4);
      /* tap highlight already off on body */
    }
    .send-btn:hover  { opacity:.9; transform:scale(1.05); }
    .send-btn:active { transform:scale(.93); }
    .send-btn svg { width:18px; height:18px; fill:#fff; }

    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,.75);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 16px;
      /* account for notch */
      padding-top: calc(16px + var(--safe-top));
      padding-bottom: calc(16px + var(--safe-bottom));
    }
    .modal {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:24px;
      padding: 26px 22px 22px;
      width: 100%;
      max-width: 360px;
      text-align:center;
      animation:modalIn .3s cubic-bezier(.34,1.4,.64,1);
      max-height: calc(100dvh - 32px - var(--safe-top) - var(--safe-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal::-webkit-scrollbar { width:3px; }
    .modal::-webkit-scrollbar-thumb { background:var(--border); }

    @keyframes modalIn {
      from { opacity:0; transform:scale(.9) translateY(20px); }
      to   { opacity:1; transform:none; }
    }
    .modal-logo {
      font-family:'Playfair Display',serif; font-style:italic;
      font-size:26px;
      background:var(--me-bg); -webkit-background-clip:text;
      -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:4px;
    }
    .modal-sub { color:var(--muted); font-size:13px; margin-bottom:18px; }

    .avatar-preview {
      width:68px; height:68px; border-radius:50%;
      background:var(--me-bg);
      display:flex; align-items:center; justify-content:center;
      font-size:34px;
      margin:0 auto 16px;
      box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent);
    }
    .avatar-preview.pop { animation:avPop .25s cubic-bezier(.34,1.7,.64,1); }
    @keyframes avPop {
      from { transform:scale(.8); }
      to   { transform:scale(1); }
    }

    .section-label {
      font-size:11px; color:var(--muted);
      text-align:left; margin-bottom:8px;
      letter-spacing:.06em; text-transform:uppercase;
    }

    /* Avatar grid: 8 cols on wide modal, 6 on narrow phones */
    .avatar-grid {
      display:grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      margin-bottom: 18px;
    }
    @media (max-width: 360px) {
      .avatar-grid { grid-template-columns: repeat(6, 1fr); gap: 4px; }
    }

    .av-opt {
      aspect-ratio:1; border-radius:50%;
      background:var(--surface2); border:2px solid transparent;
      display:flex; align-items:center; justify-content:center;
      font-size:17px; cursor:pointer;
      transition:transform .15s, border-color .15s, background .15s;
      user-select:none;
      /* minimum touch target */
      min-width: 36px;
    }
    .av-opt:active { transform:scale(.92); }
    .av-opt.active {
      border-color:var(--accent);
      background:rgba(124,106,247,.2);
      transform:scale(1.1);
    }

    .modal-input {
      width:100%; background:var(--surface2);
      border:1px solid var(--border); border-radius:12px;
      padding:12px 14px; font-family:inherit;
      font-size:16px; /* 16px prevents iOS zoom */
      color:var(--text); outline:none; margin-bottom:14px;
      transition:border-color .2s; text-align:left; display:block;
    }
    .modal-input:focus { border-color:rgba(124,106,247,.5); }
    .modal-input::placeholder { color:var(--muted); }

    .modal-btn {
      width:100%; padding:13px; border:none; border-radius:12px;
      background:var(--me-bg); color:#fff;
      font-family:inherit; font-size:15px; font-weight:600;
      cursor:pointer; transition:opacity .2s, transform .15s;
      box-shadow:0 4px 18px rgba(124,106,247,.4);
    }
    .modal-btn:active { transform:scale(.97); }

    /* ── Desktop tweaks ── */
    @media (min-width: 481px) {
      .wrapper {
        border-radius: 16px;
        height: min(860px, 95dvh);
        box-shadow: 0 24px 80px rgba(0,0,0,.5);
      }
    }
  </style>
</head>
<body>

<!-- Setup modal -->
<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <div class="modal-logo">Kết nối</div>
    <div class="modal-sub">Chọn avatar và nhập tên của bạn</div>

    <div class="avatar-preview" id="avatarPreview">🐱</div>

    <div class="section-label">Chọn avatar</div>
    <div class="avatar-grid" id="avatarGrid"></div>

    <div class="section-label">Tên của bạn</div>
    <input type="text" class="modal-input" id="nameInput"
      placeholder="Nhập tên..." maxlength="30"
      autocomplete="off" autocorrect="off" spellcheck="false" />

    <button class="modal-btn" onclick="enterChat()">Vào chat →</button>
  </div>
</div>

<!-- Chat -->
<div class="wrapper">
  <div class="header">
    <div class="header-avatar" id="headerAvatar">🐱</div>
    <div class="header-info">
      <div class="header-title" id="userLabel">Đang kết nối...</div>
      <div class="header-sub"><span class="live-dot"></span>Trực tuyến</div>
    </div>
  </div>

  <div id="chatBox">
    <div class="date-divider"><span>Hôm nay</span></div>
  </div>

  <div class="input-area">
    <textarea id="message" placeholder="Nhắn gì đó..." rows="1"
      oninput="autoResize(this)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      autocomplete="off" autocorrect="on" spellcheck="true"
    ></textarea>
    <button class="send-btn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwM2DOrKYnNAkbOZ3lvT1PKyTc1dcie0Q2-nW-0I6Pdc5EopP1GT96q8ek8AvcymLN0/exec";

  const AVATARS = [
    "🐱","🐶","🐼","🐻","🦊","🐯","🐸","🐧",
    "🦁","🐨","🐹","🐮","🐙","🦋","🐺","🦄",
    "🌸","🌻","⭐","🌙","🔥","💎","🎵","🍀",
    "🎃","👻","🤖","👾","🦸","🧙","🧜","🧚",
  ];

  let selectedAvatar = AVATARS[0];
  let currentUser = "";

  // Build avatar grid
  const grid = document.getElementById("avatarGrid");
  AVATARS.forEach((em, i) => {
    const el = document.createElement("div");
    el.className = "av-opt" + (i === 0 ? " active" : "");
    el.textContent = em;
    el.onclick = () => {
      selectedAvatar = em;
      document.querySelectorAll(".av-opt").forEach(e => e.classList.remove("active"));
      el.classList.add("active");
      const preview = document.getElementById("avatarPreview");
      preview.textContent = em;
      preview.classList.remove("pop");
      void preview.offsetWidth;
      preview.classList.add("pop");
    };
    grid.appendChild(el);
  });

  document.getElementById("nameInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); enterChat(); }
  });

  function enterChat() {
    const val = document.getElementById("nameInput").value.trim();
    if (!val) { document.getElementById("nameInput").focus(); return; }
    currentUser = val;
    document.getElementById("nameModal").style.display = "none";
    document.getElementById("headerAvatar").textContent = selectedAvatar;
    document.getElementById("userLabel").textContent = currentUser;
    fetchOnce();
  }

  function autoResize(el) {
    el.style.height = "auto";
    const maxH = Math.floor(window.innerHeight * 0.3);
    el.style.height = Math.min(el.scrollHeight, maxH) + "px";
  }

  function containsChinese(text) {
    return /[\u4e00-\u9fff]/.test(text);
  }

  function translateText(text, el, btn) {
    btn.textContent = "⏳ Đang dịch...";
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=vi&dt=t&q=${encodeURIComponent(text)}`;
    fetch(url)
      .then(r => r.json())
      .then(data => {
        btn.remove();
        const translated = data[0].map(seg => seg[0]).join("");
        const div = document.createElement("div");
        div.className = "translate-result";
        div.textContent = "🇻🇳 " + translated;
        el.appendChild(div);
      })
      .catch(() => { btn.textContent = "❌ Dịch thất bại, thử lại"; });
  }

  const userAvatarCache = {};
  let lastCount = 0;
  let isFetching = false;
  let pollDelay = 1500;
  let idleRounds = 0;
  let pollTimer = null;

  function buildMsgEl(msg) {
    const isMe = msg.user === currentUser;
    const avatar = isMe ? selectedAvatar : (userAvatarCache[msg.user] || "👤");
    const div = document.createElement("div");
    div.className = "msg " + (isMe ? "me" : "other");
    if (!isMe) {
      const avEl = document.createElement("div");
      avEl.className = "msg-avatar";
      avEl.textContent = avatar;
      div.appendChild(avEl);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (!isMe) {
      const nameEl = document.createElement("b");
      nameEl.textContent = msg.user;
      bubble.appendChild(nameEl);
    }
    bubble.appendChild(document.createTextNode(msg.message));
    if (containsChinese(msg.message)) {
      const btn = document.createElement("div");
      btn.className = "translate-btn";
      btn.innerHTML = "🌐 Dịch sang tiếng Việt";
      btn.onclick = () => translateText(msg.message, bubble, btn);
      bubble.appendChild(btn);
    }
    div.appendChild(bubble);
    return div;
  }

  function renderAll(data) {
    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = '<div class="date-divider"><span>Hôm nay</span></div>';
    data.forEach(msg => chatBox.appendChild(buildMsgEl(msg)));
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function appendNew(data) {
    const chatBox = document.getElementById("chatBox");
    const wasAtBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 80;
    data.slice(lastCount).forEach(msg => chatBox.appendChild(buildMsgEl(msg)));
    if (wasAtBottom) chatBox.scrollTop = chatBox.scrollHeight;
  }

  function fetchOnce() {
    if (isFetching) return scheduleNext();
    isFetching = true;
    fetch(API_URL)
      .then(r => r.json())
      .then(data => {
        data.forEach(msg => { if (msg.avatar) userAvatarCache[msg.user] = msg.avatar; });
        if (data.length > lastCount) {
          if (lastCount === 0) renderAll(data);
          else appendNew(data);
          lastCount = data.length;
          idleRounds = 0;
          pollDelay = 1500;
        } else {
          idleRounds++;
          if (idleRounds > 4)      pollDelay = 8000;
          else if (idleRounds > 2) pollDelay = 5000;
          else if (idleRounds > 1) pollDelay = 3000;
        }
      })
      .catch(() => { pollDelay = 5000; })
      .finally(() => { isFetching = false; scheduleNext(); });
  }

  function scheduleNext() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(fetchOnce, pollDelay);
  }

  function send() {
    const message = document.getElementById("message").value.trim();
    if (!message || !currentUser) return;
    const optimistic = { user: currentUser, message, avatar: selectedAvatar };
    const chatBox = document.getElementById("chatBox");
    chatBox.appendChild(buildMsgEl(optimistic));
    chatBox.scrollTop = chatBox.scrollHeight;
    const el = document.getElementById("message");
    el.value = "";
    el.style.height = "auto";
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(optimistic)
    }).then(() => {
      clearTimeout(pollTimer);
      pollDelay = 1000;
      pollTimer = setTimeout(fetchOnce, 400);
    });
  }
</script>
</body>
</html>
